[project]
name = "fde-kit"
version = "0.1.0"
description = "FDE kit — portable agentic SDLC workflow: engine, model registry, templates"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lab = "lab.engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "eval: eval test derived from spec.md §7 — merge gate (just evals)",
]
