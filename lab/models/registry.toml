# Lab model registry — SOURCE OF TRUTH, data-driven.
#
# Adding a model = one [[model]] entry. The orchestrator and the eval harness
# take it into account WITHOUT code changes (designed for model evolution).
# After each new model: `just eval-models all 1` then arbitration — see lab/models/EVOLUTION.md.
#
# The metrics (cost, latency, pass rate) are NOT in this file:
# they are MEASURED by the harness (fairness), not declared. Here: identity,
# eligibility by role, context profile.

schema_version = 1

# ------------------------------------------------------------------ candidates
# --- Claude 5 family — added 2026-11-12 as candidates, promoted to [roles] the same day on the
#     campaign's measured proof (lab/models/scorecards/2026-11-12-claude5.md).
#     The Claude 4 generation was removed on 2026-11-13 (Owner decision: latest models only);
#     its measured results stay in the dated scorecards.
[[model]]
id = "claude-opus-5-5"
label = "Opus 5.5"
family = "claude"
tier = "frontier"
released = ""                   # to fill in
roles = ["planner", "implementer", "reviewer"]
context_profile = "base"

[[model]]
id = "claude-sonnet-5-5"
label = "Sonnet 5.5"
family = "claude"
tier = "balanced"
released = ""
roles = ["planner", "implementer", "reviewer", "eval-runner"]
context_profile = "base"

[[model]]
id = "claude-haiku-5-5"
label = "Haiku 5.5"
family = "claude"
tier = "fast"
released = ""
roles = ["implementer", "eval-runner"]   # implementer only if it clears the eliminatory chain layer
context_profile = "base"

[[model]]
id = "claude-fable-5-2"
label = "Fable 5.2"
family = "claude"
tier = ""                       # positioning not documented in the lab yet — measured, not assumed
released = ""
roles = ["planner", "implementer", "reviewer"]
context_profile = "base"

# ---------------------------------------------------------------- context budget
# Static-context budget per role (lab/engine/context_budget.py, `just context-budget`;
# chars/4 heuristic — calibrate against the tool's own output, not a real tokenizer).
# Soft gate by design: measuring is always on, FAILING starts only when the Owner
# uncomments max_static_tokens (work/sdlc-rework ADR-4, same fusible philosophy as
# content_guard).
# [context]
# max_static_tokens = 8000

# ------------------------------------------------------- production assignment
# THE INCUMBENT: which model drives each role today. The scorecard compares
# the challengers against this baseline. Changed only on quantified proof.
# 2026-11-12 campaign (lab/models/scorecards/2026-11-12-claude5.md + incumbents re-run):
# every Claude 5 candidate clears the eliminatory chain layer; Sonnet 5.5 matches the
# incumbent implementer at lower cost, Opus 5.5 7/7 as reviewer (≠ implementer model).
# Previous: the Claude 4 generation (removed 2026-11-13, results kept in the scorecards).
[roles]
planner = "claude-opus-5-5"
implementer = "claude-sonnet-5-5"
reviewer = "claude-opus-5-5"
eval-runner = "claude-haiku-5-5"

# ------------------------------------------------------------------ review panel
# Models seated on a checkpoint's review panel, in seat order (cycled when a CP asks for
# more reviewers). Each must be reviewer-eligible above; otherwise the engine falls back to
# the default pick (non-implementer first). 2026-11-13, Owner: Opus 5.5 on every seat —
# Haiku 5.5 is not reviewer-eligible (WARNs on clean code, scorecards/2026-11-12-reviewer-1.2.0.md)
# and Sonnet 5.5 is the implementer (separation of duties).
[review]
panel = ["claude-opus-5-5", "claude-opus-5-5"]
